name: Push Dalal Pulse to app
on:
  push:
    branches: [main]
    paths: [latest.json]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST latest.json to the app endpoint
        env:
          URL: ${{ secrets.PULSE_ENDPOINT_URL }}
          TOKEN: ${{ secrets.PULSE_ENDPOINT_TOKEN }}
        run: |
          if [ -z "$URL" ]; then echo "PULSE_ENDPOINT_URL secret not set — skipping"; exit 0; fi
          AUTH=()
          if [ -n "$TOKEN" ]; then AUTH=(-H "Authorization: Bearer $TOKEN"); fi
          curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST "$URL" \
            -H "Content-Type: application/json" "${AUTH[@]}" \
            --data-binary @latest.json
